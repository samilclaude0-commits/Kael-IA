<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kael AI</title>
<meta name="description" content="Kael AI, un asistente creado por Samil Devs.">
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --line: #262b38; --text: #e8eaf0;
    --muted: #8b92a5; --accent: #7c5cff; --accent2: #5b8cff; --user: #232838;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; overflow: hidden; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); padding: 7px 12px; border-radius: 9px; }
  button:hover { background: var(--user); }

  aside { width: 270px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; flex: none; transition: transform .2s; }
  .side-top { padding: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; margin-bottom: 14px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-size: 16px; }
  #btnNew { width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; font-weight: 600; padding: 10px; }
  #chats { flex: 1; overflow-y: auto; padding: 0 10px; }
  .label { font-size: 12px; color: var(--muted); padding: 8px 18px 6px; text-transform: uppercase; letter-spacing: .05em; }
  .item { display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 10px; cursor: pointer; font-size: 14px; }
  .item:hover, .item.active { background: var(--user); }
  .item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .del { opacity: 0; border: 0; padding: 2px 6px; font-size: 13px; color: var(--muted); }
  .item:hover .del { opacity: 1; }
  .item .del:hover { color: var(--error); background: transparent; }
  .none { color: var(--muted); font-size: 13px; padding: 10px; }
  .side-bottom { padding: 14px 16px; border-top: 1px solid var(--line); }
  .credit { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .credit b { color: var(--text); }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: none; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #chat { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 12px; }
  .msg.user { justify-content: flex-end; }
  .col { max-width: 85%; min-width: 0; }
  .bubble { padding: 11px 15px; border-radius: 16px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .bubble { background: var(--user); border-bottom-right-radius: 5px; }
  .msg.model .bubble, .msg.error .bubble { padding-left: 0; }
  .msg.error .bubble { color: var(--error); font-size: 14px; }
  .avatar { width: 28px; height: 28px; flex: none; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-size: 14px; margin-top: 2px; }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .sources span { font-size: 12px; color: var(--muted); align-self: center; }
  .sources a { font-size: 12px; text-decoration: none; color: var(--accent2); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sources a:hover { background: var(--user); }
  .note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .empty { text-align: center; margin-top: 14vh; color: var(--muted); }
  .empty h1 { color: var(--text); font-size: 28px; margin-bottom: 8px; }
  .empty small { display: block; margin-top: 22px; font-size: 12px; }
  .typing { color: var(--muted); }
  .typing span { animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  footer { padding: 14px 16px 18px; }
  .box { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 10px 10px 16px; }
  .box:focus-within { border-color: var(--accent); }
  textarea { flex: 1; resize: none; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; max-height: 180px; padding: 6px 0; }
  #web { border-radius: 12px; height: 38px; padding: 0 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  #web.on { color: var(--text); border-color: var(--accent); background: rgba(124, 92, 255, .15); }
  #send { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; width: 38px; height: 38px; border-radius: 12px; font-size: 18px; padding: 0; }
  #send:disabled { opacity: .4; cursor: default; }
  .hint { max-width: 760px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--muted); }

  @media (max-width: 760px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); width: 280px; }
    aside.open { transform: none; }
    .topbar { display: flex; }
    .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 5; }
    .scrim.open { display: block; }
    #web { padding: 0 9px; }
  }
</style>
</head>
<body>

<aside id="side">
  <div class="side-top">
    <div class="brand"><div class="logo">✦</div> Kael AI</div>
    <button id="btnNew">+ Nuevo chat</button>
  </div>
  <div class="label">Tus chats</div>
  <div id="chats"></div>
  <div class="side-bottom">
    <div class="credit"><b>Kael AI</b> v0.5<br>Creado por <b>Samil Devs</b></div>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="main">
  <div class="topbar">
    <button id="btnMenu">☰</button>
    <div class="brand" style="margin:0"><div class="logo">✦</div> Kael AI</div>
  </div>
  <main id="chat"><div class="wrap" id="list"></div></main>
  <footer>
    <div class="box">
      <textarea id="input" rows="1" placeholder="Escríbele a Kael…"></textarea>
      <button id="web" title="Cuando está activado, Kael busca información en internet">🌐 Buscar en la web</button>
      <button id="send" title="Enviar">➤</button>
    </div>
    <div class="hint">Enter para enviar · Shift + Enter para salto de línea</div>
  </footer>
</div>

<script>
/* =====================================================
   CONFIGURACIÓN DE KAEL  ·  Samil Devs
   Para cambiar la clave, edita solo la línea GEMINI_KEY.
   ===================================================== */
const GEMINI_KEY = "AQ.Ab8RN6Igu3Z1Kee6yk9Oh6SlbiS2jvnJcD9ziqy0_EL40DD2Wg";
const MODEL = "gemini-3.8-flash";
const PERSONA = `Eres Kael AI, un asistente inteligente, amable y directo, creado por Samil Devs.
- Respondes en el mismo idioma en que te escriben (por defecto, español).
- Eres claro y natural: sin rodeos, sin sonar robótico.
- Si no sabes algo, lo dices con honestidad en vez de inventarlo.
- Cuando necesites información actual o datos que no sabes, buscas en la web y la resumes con tus palabras.
- Ayudas con preguntas, ideas, textos, estudio, programación y cualquier tema.`;
const MAX_MESSAGES = 30;   // mensajes recientes que se envían a Gemini
const MAX_CHARS = 4000;    // largo máximo de cada mensaje

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const titleOf = t => { t = t.replace(/\s+/g, ' ').trim(); return t.length > 38 ? t.slice(0, 38) + '…' : t; };

/* ---------- Datos guardados en el navegador de cada persona ---------- */
function loadState() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem('kael2') || 'null'); } catch (e) {}
  d = d || {};
  d.chats = d.chats || [];
  d.current = d.current || null;
  d.search = d.search !== false;                       // búsqueda web activada por defecto
  delete d.key; delete d.model; delete d.persona;
  return d;
}
let S = loadState();
const save = () => { try { localStorage.setItem('kael2', JSON.stringify(S)); } catch (e) {} };
const current = () => S.chats.find(c => c.id === S.current) || null;

/* ---------- Pantalla ---------- */
const list = $('#list'), input = $('#input'), sendBtn = $('#send'), chatEl = $('#chat'), webBtn = $('#web');
let busy = false;

function addBubble(role, text, sources, note) {
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  if (role === 'model') { const a = document.createElement('div'); a.className = 'avatar'; a.textContent = '✦'; m.appendChild(a); }
  const col = document.createElement('div'); col.className = 'col';
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
  col.appendChild(b);
  if (sources && sources.length) {
    const s = document.createElement('div'); s.className = 'sources';
    const lab = document.createElement('span'); lab.textContent = 'Fuentes:'; s.appendChild(lab);
    sources.forEach(src => {
      if (!/^https?:\/\//.test(src.uri)) return;
      const a = document.createElement('a');
      a.href = src.uri; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = src.title; a.title = src.title;
      s.appendChild(a);
    });
    col.appendChild(s);
  }
  if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note; col.appendChild(n); }
  m.appendChild(col); list.appendChild(m);
  chatEl.scrollTop = chatEl.scrollHeight;
  return m;
}

function renderChat() {
  list.innerHTML = '';
  const c = current();
  if (!c || !c.msgs.length) {
    list.innerHTML = '<div class="empty"><h1>Hola, soy Kael ✦</h1><p>¿En qué te ayudo hoy?</p><small>Kael AI · Samil Devs</small></div>';
    return;
  }
  c.msgs.forEach(m => addBubble(m.role, m.text, m.sources, m.note));
}

function renderList() {
  const box = $('#chats');
  box.innerHTML = '';
  if (!S.chats.length) { box.innerHTML = '<div class="none">Aún no tienes chats. Escribe algo para empezar.</div>'; return; }
  [...S.chats].sort((a, b) => b.updated - a.updated).forEach(c => {
    const it = document.createElement('div');
    it.className = 'item' + (c.id === S.current ? ' active' : '');
    const t = document.createElement('div'); t.className = 't'; t.textContent = c.title;
    const d = document.createElement('button'); d.className = 'del'; d.textContent = '🗑'; d.title = 'Borrar chat';
    d.addEventListener('click', e => { e.stopPropagation(); if (confirm('¿Borrar este chat?')) deleteChat(c.id); });
    it.append(t, d);
    it.addEventListener('click', () => { if (busy) return; S.current = c.id; save(); renderList(); renderChat(); closeMenu(); });
    box.appendChild(it);
  });
}

function newChat() { if (busy) return; S.current = null; save(); renderList(); renderChat(); closeMenu(); input.focus(); }
function deleteChat(id) {
  S.chats = S.chats.filter(c => c.id !== id);
  if (S.current === id) S.current = null;
  save(); renderList(); renderChat();
}

/* ---------- Hablar con Gemini ---------- */
async function askKael(msgs) {
  let contents = msgs.slice(-MAX_MESSAGES).map(m => ({
    role: m.role === 'model' ? 'model' : 'user',
    parts: [{ text: String(m.text).slice(0, MAX_CHARS) }]
  }));
  while (contents.length && contents[0].role !== 'user') contents.shift();   // Gemini exige empezar con el usuario

  let useSearch = S.search, note = '';
  const makeBody = () => {
    const b = { systemInstruction: { parts: [{ text: PERSONA }] }, contents };
    if (useSearch) b.tools = [{ google_search: {} }];                        // Kael busca en la web
    return b;
  };

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(MODEL)}:generateContent`;
  for (let i = 0; i < 3; i++) {
    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': GEMINI_KEY },
        body: JSON.stringify(makeBody())
      });
    } catch (e) {                                   // fallo de red: reintenta
      await new Promise(r => setTimeout(r, 1200));
      continue;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (useSearch && (res.status === 429 || res.status === 400)) {         // la búsqueda web puede estar sin cuota: reintenta sin ella
        useSearch = false; note = 'Búsqueda web no disponible en este momento.'; i--; continue;
      }
      const msg = data?.error?.message || ('Error ' + res.status);
      if (res.status === 429) throw new Error('Límite de uso de Gemini alcanzado. Detalle: ' + msg);
      throw new Error(msg);
    }
    const cand = (data.candidates || [])[0] || {};
    const text = (cand.content?.parts || []).map(p => p.text || '').join('').trim();
    if (!text) throw new Error('Kael no devolvió respuesta. Intenta de nuevo.');
    const seen = new Set(), sources = [];
    (cand.groundingMetadata?.groundingChunks || []).forEach(ch => {
      const w = ch.web || {};
      if (w.uri && /^https?:\/\//.test(w.uri) && !seen.has(w.uri)) { seen.add(w.uri); sources.push({ title: w.title || w.uri, uri: w.uri }); }
    });
    return { text, sources: sources.slice(0, 5), note };
  }
  throw new Error('No pude conectarme a Gemini. Revisa tu internet.');
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = ''; autosize();

  let c = current();
  if (!c) {
    c = { id: uid(), title: titleOf(text), msgs: [], updated: Date.now() };
    S.chats.push(c); S.current = c.id;
  }
  if (!c.msgs.length) list.innerHTML = '';
  c.msgs.push({ role: 'user', text }); c.updated = Date.now(); save(); renderList();
  addBubble('user', text);
  const typing = addBubble('model', '');
  typing.querySelector('.bubble').innerHTML = '<span class="typing"><span>●</span><span>●</span><span>●</span></span>';

  try {
    const data = await askKael(c.msgs);
    typing.remove();
    c.msgs.push({ role: 'model', text: data.text, sources: data.sources, note: data.note });
    c.updated = Date.now(); save(); renderList();
    addBubble('model', data.text, data.sources, data.note);
  } catch (err) {
    typing.remove();
    c.msgs.pop();
    if (!c.msgs.length) { S.chats = S.chats.filter(x => x.id !== c.id); S.current = null; }
    save(); renderList();
    if (!c.msgs.length) renderChat();
    addBubble('error', '⚠ ' + err.message);
    input.value = text; autosize();
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

/* ---------- Controles ---------- */
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
sendBtn.addEventListener('click', send);
$('#btnNew').addEventListener('click', newChat);

function paintWeb() { webBtn.classList.toggle('on', S.search); webBtn.textContent = S.search ? '🌐 Web: sí' : '🌐 Web: no'; }
webBtn.addEventListener('click', () => { S.search = !S.search; save(); paintWeb(); });

const side = $('#side'), scrim = $('#scrim');
const closeMenu = () => { side.classList.remove('open'); scrim.classList.remove('open'); };
$('#btnMenu').addEventListener('click', () => { side.classList.add('open'); scrim.classList.add('open'); });
scrim.addEventListener('click', closeMenu);

paintWeb();
renderList();
renderChat();
</script>
</body>
</html>
